name: Build and deploy status page

on:
  push:
    branches: [main]
  schedule:
    # Every 5 minutes is the floor GitHub accepts; expect 10–20 min in practice.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a new trigger waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  STATUS_BASE: https://isc3.uptimepage.dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Snapshot public status
        run: bun run snapshot
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # The e-paper panel can show dist/trmnl.html or this image of it. A
      # failure here must not hold back the status page itself.
      - name: Render the e-paper image
        continue-on-error: true
        run: scripts/trmnl-png.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A hung deploy would hold the "pages" concurrency group and starve every
    # later run (each new scheduled run cancels the previously queued one).
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
